name: Lint for accessibility issues

on: 
    pull_request:
        branches: [main]

jobs:
  axe-linter:
    name: Axe Linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dequelabs/axe-linter-action@v1
        with:
          api_key: ${{ secrets.AXE_LINTER_API_KEY }}
          github_token: ${{ secrets.TOKEN_GIT }}